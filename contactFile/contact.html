<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Use the contact form to send a message, suggestion, or feedback to the show's host. We'd love to hear from you!">
    <meta name="keywords" content="contact, message, suggestion, feedback, podcast, show host, reach out, contact form">
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="../css/general.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rubik:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script src="../js/form.js" defer></script>
    <script src="../js/footerForm.js" defer></script>
    <title>Contact</title>
</head>
<body>
<header>
    <nav id="nav" class="flex">
            <a class="logo" href="../index.html"><img src="../img/Podcast.png" alt="Logo de pagina web"></a>
            <input type="checkbox" name="Menu" id="responsiveMenu" placeholder="menu">
            <label for="responsiveMenu" id="burgerMenu" class="flex">
                <div id="bar"></div>
                <div id="bar1"></div>
                <div id="bar2"></div>
            </label>
            <nav id="nav-responsive" class="flex">
                <ul class="flex">
                    <li><a href="../index.html" class="text" aria-label="Go to homepage">Home</a></li>
                    <li><a href="./episodes.html" class="text" aria-label="Browse podcast episodes">Episode</a></li>
                    <li><a href="./about.html" class="text" aria-label="Learn more about us">About</a></li>
                    <li><a href="./contact.html" class="text" aria-label="Contact us">Contact</a></li>
                    <li><a href="../blog/blog.html" class="text" aria-label="Read our blog posts">Blog</a></li>
                </ul>
            </nav>
        </nav>

</header>
<main>
    <form action="#" class="flex">
        <input type="text" class="border" placeholder="Name" id="name">
        <label for="text" name="text" id="text"></label>
        <span class="error" id="error-name"></span>

        <input type="email" class="border" placeholder="Email" id="email">
        <label for="email" name="email" id="email"></label>
        <span class="error" id="error-email"></span>

        <input type="phone" class="border" placeholder="Phone" id="phone">
        <label for="phone" name="phone" id="phone"></label>
        <span class="error" id="error-phone"></span>

        <textarea name="" id="message" class="border" placeholder="Message" ></textarea>
        <span class="error" id="error-message"></span>

        <button class="button flex" type="button" id="buttonForm"> 
            <div class="flex">
                <p class="text">Send</p>
            </div>
        </button>
    </form>
</main>
    
    <footer class="grid">
        <a class="logo" href="#"><img src="../img/Podcast.png" alt="Logo de pagina web"></a>
        <label for="email-podcast"></label>
        <input type="email" id="email-podcast" placeholder="Email">
       <button class="button flex" type="button" id="buttonSubscribe"> <div class="flex"><p class="text"></p>subcribe</div></button>
       <div id="img-container">
            <img src="../icon/facebook.png" alt="icon de la red social facebook" class="icons">
            <img src="../icon/Reddit.png" alt="icon de la red social Reddit" class="icons">
            <img src="../icon/Spotify.png" alt="icon de la red social Spotify" class="icons">
            <img src="../icon/Youtube.png" alt="icon de la red social Youtube" class="icons">
            <img src="../icon/Discord.png" alt="icon de la red social Discord" class="icons">
            <img src="../icon/Tiktok.png" alt="icon de la red social Tiktok" class="icons">
       </div>
       <ul class="ul-footer">
                    <li><a href="./index.html" class="text" aria-label="Go to homepage">Home</a></li>
                    <li><a href="./episodes.html" class="text" aria-label="Browse podcast episodes">Episode</a></li>
                    <li><a href="./about.html" class="text" aria-label="Learn more about us">About</a></li>
                    <li><a href="./contact.html" class="text" aria-label="Contact us">Contact</a></li>
                    <li><a href="../blog/blog.html" class="text" aria-label="Read our blog posts">Blog</a></li>
        </ul>
    </footer>
</body>
</html>
